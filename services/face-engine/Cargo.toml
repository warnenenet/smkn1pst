[package]
name = "face-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
description = "Pure Rust SCRFD + LMEDS + ArcFace facial recognition & RTSP engine for Absensi SMK"

[dependencies]
axum = "0.8.1"
base64 = "0.22.1"
clap = { version = "4.5.30", features = ["derive"] }
ffmpeg-next = "7.1.0"
hdbscan = "0.12.0"
image = { version = "0.25.5", default-features = false, features = ["jpeg", "png"] }
ort = { version = "2.0.0-rc.10", default-features = false, features = ["std", "ndarray", "load-dynamic"] }
rusqlite = { version = "0.34.0", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
tokio = { version = "1.43.0", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
ureq = "2.12.1"

[dev-dependencies]
tempfile = "3.16.0"

[[bin]]
name = "face-engine"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
