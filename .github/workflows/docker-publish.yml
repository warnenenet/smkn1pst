name: Build & Publish Docker Hub

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag tambahan image Docker (opsional, misal v1.0.0)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub (Primary)
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry (Fallback jika Docker Hub belum diset)
        if: ${{ secrets.DOCKERHUB_USERNAME == '' || secrets.DOCKERHUB_TOKEN == '' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            DH_USER=$(echo "${{ secrets.DOCKERHUB_USERNAME }}" | tr '[:upper:]' '[:lower:]')
            DH_REPO="${{ vars.DOCKERHUB_REPO }}"
            if [ -z "${DH_REPO}" ]; then
              DH_REPO="absensi-smk-face-ai"
            fi
            TAGS="${DH_USER}/${DH_REPO}:latest,${DH_USER}/${DH_REPO}:${SHORT_SHA}"
            if [ -n "${{ github.event.inputs.image_tag }}" ]; then
              TAGS="${TAGS},${DH_USER}/${DH_REPO}:${{ github.event.inputs.image_tag }}"
            fi
            echo "Registry target: Docker Hub (${DH_USER}/${DH_REPO})"
          else
            REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            TAGS="ghcr.io/${REPO_LOWER}:latest,ghcr.io/${REPO_LOWER}:${SHORT_SHA}"
            echo "WARNING: DOCKERHUB_USERNAME / DOCKERHUB_TOKEN belum diset di Repository Secrets; publish dialihkan ke GHCR (${REPO_LOWER})."
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push amd64 all-in-one Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
