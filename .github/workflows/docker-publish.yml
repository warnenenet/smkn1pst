name: Build & Publish Docker Hub

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag tambahan image Docker (opsional, misal v1.0.0)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image tags & target registry
        id: meta
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_REPO: ${{ vars.DOCKERHUB_REPO }}
          INPUT_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
            DH_USER=$(echo "${DOCKERHUB_USERNAME}" | tr '[:upper:]' '[:lower:]')
            DH_REPO="${DOCKERHUB_REPO:-absensi-smk-face-ai}"
            TAGS="${DH_USER}/${DH_REPO}:latest,${DH_USER}/${DH_REPO}:${SHORT_SHA}"
            if [ -n "${INPUT_TAG}" ]; then
              TAGS="${TAGS},${DH_USER}/${DH_REPO}:${INPUT_TAG}"
            fi
            echo "use_dockerhub=true" >> "$GITHUB_OUTPUT"
            echo "Registry target: Docker Hub (${DH_USER}/${DH_REPO})"
          else
            REPO_LOWER=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
            TAGS="ghcr.io/${REPO_LOWER}:latest,ghcr.io/${REPO_LOWER}:${SHORT_SHA}"
            echo "use_dockerhub=false" >> "$GITHUB_OUTPUT"
            echo "WARNING: DOCKERHUB_USERNAME / DOCKERHUB_TOKEN belum diset di Repository Secrets; publish dialihkan ke GHCR (${REPO_LOWER})."
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub (Primary)
        if: steps.meta.outputs.use_dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry (Fallback jika Docker Hub belum diset)
        if: steps.meta.outputs.use_dockerhub != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64 all-in-one Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
