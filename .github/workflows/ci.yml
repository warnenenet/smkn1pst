name: CI - Test, Lint & Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript type check
        run: npm run lint

      - name: Run domain & server logic unit tests
        run: npx tsx --test src/lib/*.test.ts

      - name: Validate Baileys WA gateway syntax
        run: node --check services/wa-gateway-node/server.mjs

      - name: Build production frontend bundle
        run: npm run build

      - name: Install Rust dependencies & test face-engine
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            pkg-config libavcodec-dev libavformat-dev libavutil-dev libswscale-dev clang libclang-dev
          cargo test --manifest-path services/face-engine/Cargo.toml
