[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:node-web]
command=node /app/server.ts
directory=/app
autostart=true
autorestart=true
startsecs=3
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=NODE_ENV="production",PORT="80",DATA_DIR="/app/data",FACE_SERVICE_URL="http://127.0.0.1:8001",PIPER_BIN="/usr/local/piper/piper",PIPER_MODEL="/app/models/piper/id_ID-news_tts-medium.onnx"

[program:python-face-service]
command=/opt/venv/bin/uvicorn main:app --host 127.0.0.1 --port 8001 --workers 1
directory=/app/services/face-service
autostart=true
autorestart=true
startsecs=5
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=WEB_BACKEND_URL="http://127.0.0.1:80",DATA_DIR="/app/data",INSIGHTFACE_HOME="/app/models/insightface",RUST_ACCEL_BIN="/app/bin/face_accel",OMP_NUM_THREADS="4",OPENBLAS_NUM_THREADS="4",ORT_INTRA_OP_NUM_THREADS="4",ORT_INTER_OP_NUM_THREADS="2",FACE_WORKER_INSTANCES="4",PROCESS_EVERY_N_FRAMES="2"
