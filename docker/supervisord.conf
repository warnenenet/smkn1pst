[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:node-web]
command=node /app/server.ts
directory=/app
autostart=true
autorestart=true
startsecs=3
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=NODE_ENV="production",PORT="80",DATA_DIR="/app/data",WA_STORAGE_DIR="/app/storage",INTERNAL_TOKEN_FILE="/app/storage/secrets/internal_token",FACE_SERVICE_URL="http://127.0.0.1:8001",WA_GATEWAY_AUTO_SPAWN="0",PIPER_BIN="/usr/local/piper/piper",PIPER_MODEL="/app/models/piper/id_ID-news_tts-medium.onnx"

[program:python-face-service]
command=/opt/venv/bin/uvicorn main:app --host 127.0.0.1 --port 8001 --workers 1
directory=/app/services/face-service
autostart=true
autorestart=true
startsecs=5
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=WEB_BACKEND_URL="http://127.0.0.1:80",DATA_DIR="/app/data",WA_STORAGE_DIR="/app/storage",INTERNAL_TOKEN_FILE="/app/storage/secrets/internal_token",INSIGHTFACE_HOME="/app/models/insightface",RUST_ACCEL_BIN="/app/bin/face_accel",MPLCONFIGDIR="/tmp/matplotlib",PROCESS_EVERY_N_FRAMES="2"

[program:python-wa-gateway]
command=/app/services/wa-gateway/.venv/bin/gunicorn --bind 127.0.0.1:8003 --workers 1 --threads 4 --timeout 120 app:app
directory=/app/services/wa-gateway
autostart=true
autorestart=true
startsecs=5
priority=25
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",WA_GATEWAY_HOST="127.0.0.1",WA_STORAGE_DIR="/app/storage",CHROME_BIN="/usr/bin/chromium",CHROMEDRIVER_BIN="/usr/bin/chromedriver",ENABLE_XVFB_FALLBACK="1"
