services:
  absensi-smk:
    build:
      context: .
      dockerfile: Dockerfile
    image: absensi-smk-face-ai:latest
    container_name: ${COMPOSE_PROJECT_NAME:-absensi-smk-allinone}
    restart: unless-stopped
    # Note: Do NOT enable Docker `init: true` because s6-overlay (/init) MUST run as PID 1.
    stop_grace_period: 15s
    cpus: "${DOCKER_CPU_LIMIT:-12}"
    mem_limit: "${DOCKER_MEM_LIMIT:-4g}"
    pids_limit: ${DOCKER_PIDS_LIMIT:-512}
    ports:
      - "127.0.0.1:${HOST_PORT:-3081}:80"
    environment:
      TZ: "Asia/Jakarta"
      ORT_INTRA_THREADS: "${ORT_INTRA_THREADS:-4}"
      MAX_CAMERA_WORKERS: "${MAX_CAMERA_WORKERS:-8}"
      PROCESS_EVERY_N_FRAMES: "${PROCESS_EVERY_N_FRAMES:-2}"
      DET_MODEL_SHA256: "${DET_MODEL_SHA256:-}"
      REC_MODEL_SHA256: "${REC_MODEL_SHA256:-}"
      ORT_DYLIB_SHA256: "${ORT_DYLIB_SHA256:-}"
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
