services:
  face-service:
    build:
      context: .
      dockerfile: Dockerfile.face-service
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    cpus: "${FACE_CPU_LIMIT:-4}"
    mem_limit: "${FACE_MEM_LIMIT:-3g}"
    pids_limit: ${FACE_PIDS_LIMIT:-160}
    network_mode: host
    user: "${FACE_UID:-0}:${FACE_GID:-0}"
    env_file:
      - .env
    environment:
      TZ: "Asia/Jakarta"
      HOME: "/tmp"
      MPLCONFIGDIR: "/tmp/matplotlib"
      FACE_PORT: "${FACE_PORT:-8001}"
      PORT: "${PORT:-3001}"
      WEB_BACKEND_URL: "http://127.0.0.1:${PORT:-3001}"
      DATA_DIR: "/app/data"
      WA_STORAGE_DIR: "/app/storage"
      INSIGHTFACE_HOME: "/app/models/insightface"
      RUST_ACCEL_BIN: "/app/bin/face_accel"
      INTERNAL_TOKEN_FILE: "/app/data/secrets/internal_token"
      OMP_NUM_THREADS: "${OMP_NUM_THREADS:-2}"
      OPENBLAS_NUM_THREADS: "${OPENBLAS_NUM_THREADS:-1}"
      MKL_NUM_THREADS: "${MKL_NUM_THREADS:-1}"
      OMP_WAIT_POLICY: "${OMP_WAIT_POLICY:-PASSIVE}"
      GOMP_SPINCOUNT: "${GOMP_SPINCOUNT:-0}"
      OPENCV_THREADS: "${OPENCV_THREADS:-2}"
      FACE_WORKER_INSTANCES: "${FACE_WORKER_INSTANCES:-2}"
      ORT_INTRA_THREADS: "${ORT_INTRA_THREADS:-2}"
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:$${FACE_PORT:-8001}/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 25s
