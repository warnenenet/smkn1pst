[package]
name = "gate_a_spike"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Gate A benchmark & accuracy spike for Absensi SMK Face AI (MediaPipe vs SCRFD + ort ArcFace)"

[dependencies]
clap = { version = "4.6.10", features = ["derive"] }
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg"] }
mediapipe = { version = "0.1.0", default-features = false }
ort = { version = "2.0.0-rc.10", default-features = false, features = ["std", "download-binaries", "copy-dylibs"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
